name = "script-router"
main = "src/worker.ts"
compatibility_date = "2026-11-21"
compatibility_flags = ["nodejs_compat"]

# 构建：先跑 npm run build（tools/build-assets.mjs），
# 只把 index.html + scripts/*.sh|*.ps1 复制到 dist/，
# 再部署。没有这一步，dist/ 在 CI 里不存在，部署会失败。
[build]
command = "npm run build"

# 静态资源：只能指向 dist/，不能指向仓库根目录 "./"。
# 指向 "./" 时 Wrangler 会把整个仓库（包括 node_modules/workerd，
# 155 MiB，远超单文件 25 MiB 上限）都当成 assets 上传，直接报错。
# dist/ 里只有 index.html + scripts/，很小。
# run_worker_first 很关键：默认命中静态文件会直接返回、不跑 Worker，
# 那样浏览器访问 /arch.sh 会拿到脚本而不是 index.html，UA 分流就失效了。
[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

# 注意：不要在这里加 pages_build_output_dir。
# 一是它放在 [assets] 后面会被当成 assets 的字段，Wrangler 会警告
# "Unexpected fields found in assets field"；二是 Pages 本来就不从
# wrangler.toml 读构建命令，Pages 的 Build command / Output directory
# 在 Dashboard 里填（Build command: npm run build，Output: dist）。

# 短链接（D1+KV，根路径 /xxxx）：id 不写死，别人 fork 后也能直接部署。
# 原理是 Wrangler 自动创建资源：绑定里只写名字、不写 id，部署时
# Wrangler 会自动建库/命名空间（以 Worker 名为前缀），本地部署还会把
# id 写回这个文件；经 Dashboard/Git 部署时 id 只在 Dashboard 里能看到，
# 仓库里不用改。官方说法：add bindings without resource IDs, resources
# will be created with the name of your worker as the prefix.
# 部署后还要跑一次建表（自动创建只建空库，不跑 SQL）：
#   npx wrangler d1 migrations apply script-router-links --remote
# 创建 token（Secret，不写进仓库，运行时 env.SHORT_TOKEN）：
#   npx wrangler secret put SHORT_TOKEN
# 已有自己的 D1/KV 想复用时，才需要手动把 id 填回来（见下两行注释）；
# 没填 id 时不要自己先跑 d1/kv create，否则会建出两套资源。
[[d1_databases]]
binding = "DB"
database_name = "script-router-links"
migrations_dir = "migrations"
# database_id = "已有库才填，填了就不用自动创建"
[[kv_namespaces]]
binding = "SHORT_CACHE"
# id = "已有命名空间才填，填了就不用自动创建"

# 自定义域名 k7s.top：在 Dashboard -> Workers -> script-router -> Settings -> Domains 里绑，
# 或取消下面注释（域名需已托管在 Cloudflare）：
# routes = [
#   { pattern = "k7s.top", custom_domain = true },
# ]

[observability]
enabled = true
